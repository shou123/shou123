name: Profile metrics

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    name: Light activity statistics
    runs-on: ubuntu-latest
    steps:
      - name: Render profile metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: shou123
          template: classic
          base: ""
          config_display: large
          config_timezone: America/New_York
          config_animations: no
          config_octicon: yes
          repositories_forks: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          plugin_leetcode: yes
          plugin_leetcode_user: shou123
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_skills: 8
          plugin_leetcode_limit_recent: 3

          extras_css: |
            svg {
              background: #ffffff !important;
            }

            section > svg[viewBox="0,0 480,270"] > g > g {
              --iso-empty: #efefef;
            }
            section > svg[viewBox="0,0 480,270"] > g > g:nth-child(-n+5),
            section > svg[viewBox="0,0 480,270"] > g > g:nth-child(n+48) {
              --iso-1: #999999;
              --iso-2: #cccccc;
              --iso-3: #dddddd;
              --iso-4: #eeeeee;
            }
            section > svg[viewBox="0,0 480,270"] > g > g:nth-child(n+6):nth-child(-n+18) {
              --iso-1: #ffe7ff;
              --iso-2: #edaeda;
              --iso-3: #e492ca;
              --iso-4: #ba7aad;
            }
            section > svg[viewBox="0,0 480,270"] > g > g:nth-child(n+19):nth-child(-n+32) {
              --iso-1: #d8e887;
              --iso-2: #8cc569;
              --iso-3: #47a042;
              --iso-4: #1d6a23;
            }
            section > svg[viewBox="0,0 480,270"] > g > g:nth-child(n+33):nth-child(-n+47) {
              --iso-1: #ffed4a;
              --iso-2: #ffc402;
              --iso-3: #fe9400;
              --iso-4: #fa6100;
            }

            section > svg[viewBox="0,0 480,270"] > g > g > g > path[fill="#ebedf0"] {
              fill: var(--iso-empty) !important;
            }
            section > svg[viewBox="0,0 480,270"] > g > g > g > path[fill="#9be9a8"] {
              fill: var(--iso-1) !important;
            }
            section > svg[viewBox="0,0 480,270"] > g > g > g > path[fill="#40c463"] {
              fill: var(--iso-2) !important;
            }
            section > svg[viewBox="0,0 480,270"] > g > g > g > path[fill="#30a14e"] {
              fill: var(--iso-3) !important;
            }
            section > svg[viewBox="0,0 480,270"] > g > g > g > path[fill="#216e39"] {
              fill: var(--iso-4) !important;
            }
            section > svg[viewBox="0,0 480,270"] > g > g > g > path:first-child {
              stroke: #c6c8ca !important;
              stroke-width: 0.2px !important;
              stroke-linejoin: round;
            }

            h2, h3, .field, .field > span {
              color: #24292f !important;
            }
            .muted, .field small {
              color: #57606a !important;
            }
